# Netlify Configuration — Jungle Resort Patna
# Docs: https://docs.netlify.com/routing/headers/

# ── SPA Routing ──────────────────────────────────────────────────────────────
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Cache Headers ─────────────────────────────────────────────────────────────

# JS & CSS chunks: content-hashed filenames → safe for 1-year immutable cache
[[headers]]
  for = "/static/js/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/static/css/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/static/media/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

# Images: long cache (1 week — changed manually so no hash)
[[headers]]
  for = "/images/*"
  [headers.values]
  Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/videos/*"
  [headers.values]
  Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/eventPics/*"
  [headers.values]
  Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/WaterParkAds/*"
  [headers.values]
  Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Fonts (served from public/)
[[headers]]
  for = "/*.woff2"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

# PWA files: no cache
[[headers]]
  for = "/manifest.json"
  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

# HTML: never cache (always fresh)
[[headers]]
  for = "/*.html"
  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

# ── Security Headers (Best Practices score) ───────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
  X-Frame-Options = "DENY"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "camera=(), microphone=(), geolocation=()"
